[workspace]
members = ["lef_tools", "def_tools"]
resolver = "3"

[workspace.package]
# One project, one version: every distribution and crate inherits this.
version = "2026.11.9"

[package]
name = "liberty_tools_native"
version.workspace = true
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
# zlib-rs backend: pure-Rust, ~2-3x faster inflate than the default miniz_oxide,
# no C toolchain. Speeds the gzip decompress that dominates LibraryIndex.open.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "=0.28.3", features = ["extension-module"] }
quine-mc_cluskey = "0.2.4"
