[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "2026.11.20"
edition = "2024"

[package]
name = "open-eda-file-tools-native"
version.workspace = true
edition.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "thin"

# Distribution wheels (pyproject `[tool.maturin] profile`): fat LTO, a few percent
# faster Liberty parsing, but ~3x slower to link than thin.
[profile.dist]
inherits = "release"
lto = "fat"

[dependencies]
open-eda-file-tools-core = { path = "core" }
arrow = { version = "60.1", default-features = false, features = ["ipc"] }
# zlib-rs backend: pure-Rust; the writer's .lib.gz output path.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
parquet = { version = "60.1", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "=0.28.3", features = ["extension-module"] }
rayon = "1.11"
