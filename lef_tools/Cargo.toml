[package]
name = "lef-tools-native"
version.workspace = true
edition = "2024"
description = "Rust backend for cell LEF parsing and queries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/smprather/open-eda-file-tools"

[lib]
name = "lef_tools_native"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
