[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lef-tools"
version = "2026.11.0"
description = "Fast cell LEF parsing and query tools"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Myles Prather" },
]
keywords = ["eda", "lef", "vlsi", "standard-cells"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.4.1",
]

[project.scripts]
lef-tools = "lef_tools.cli:main"

[project.urls]
Repository = "https://github.com/smprather/open-eda-file-tools"
Issues = "https://github.com/smprather/open-eda-file-tools/issues"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=9.0.3",
    "ruff>=0.16.2",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["target", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "BLE",    # blind except
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["."]

[tool.maturin]
bindings = "pyo3"
module-name = "lef_tools._lef"
python-source = "src"
include = ["src/lef_tools/py.typed", "src/lef_tools/_lef.pyi"]
exclude = [
    "*.lef",
    "*.lef.gz",
    "*.pdf",
    "dist",
    "target",
]
