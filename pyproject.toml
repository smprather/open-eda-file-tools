[project]
name = "open-eda-file-tools"
version = "2026.11.10"
description = "Fast Rust-backed Liberty, LEF, and DEF parsers and CLI tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.4.1",
  "fastapi>=0.136.3",
  "polars>=2.1.0",
  "rich-click>=1.9.8",
  "uvicorn[standard]>=0.48.0",
]

[project.scripts]
liberty-view = "viewer.__main__:main"
liberty-format = "liberty_format.__main__:main"
lef-tools = "lef_tools.cli:main"
def-tools = "def_tools.cli:main"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "liberty_tools._native"
python-source = "."
# maturin only auto-bundles the `liberty_tools` package; list the sibling
# packages and static assets explicitly so all libraries and CLIs work after a
# non-editable wheel install (`uv tool install .` / `uv build --wheel`).
include = [
  "viewer/**/*.py",
  "viewer/static/*",
  "liberty_format/**/*.py",
  "lef_tools/*.py",
  "lef_tools/py.typed",
  "def_tools/*.py",
  "def_tools/py.typed",
]
exclude = [
  "*.def",
  "*.def.gz",
  "*.lef",
  "*.lef.gz",
  "*.pdf",
  "*.sdc",
  "*.ldefcache",
  "*.parquet",
  "*.table",
  "dist",
  "target",
]

[dependency-groups]
dev = [
  "liberty-parser>=0.0.29",
  "maturin>=1.8,<2",
  "py7zr>=1.1.0",
  "pymupdf4llm>=1.27.2.3",
  "pypdf>=6.12.2",
  "pytest>=9.0.1",
  "ruff>=0.15.12",
  "ty>=0.0.35",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["perf: performance test, needs --runperf"]

[tool.ty.src]
exclude = ["vendor"]
