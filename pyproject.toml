[project]
name = "liberty-tools"
version = "2.0.1"
description = "Fast Rust-backed parser and query tools for Liberty files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.4.1",
  "fastapi>=0.136.3",
  "polars>=2.1.0",
  "uvicorn[standard]>=0.48.0",
]

[project.scripts]
liberty-view = "viewer.__main__:main"
liberty-format = "liberty_format.__main__:main"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "liberty_tools._native"
python-source = "."
# maturin only auto-bundles the `liberty_tools` package; the viewer (FastAPI app
# + its static assets) must be listed explicitly so `liberty-view` works after a
# non-editable `uv tool install .`.
include = ["viewer/**/*.py", "viewer/static/*", "liberty_format/**/*.py"]

[dependency-groups]
dev = [
  "liberty-parser>=0.0.29",
  "maturin>=1.8,<2",
  "py7zr>=1.1.0",
  "pymupdf4llm>=1.27.2.3",
  "pypdf>=6.12.2",
  "pytest>=9.0.1",
  "ruff>=0.15.12",
  "ty>=0.0.35",
]

[tool.pytest.ini_options]
# Each tool owns its tests; the LEF and DEF projects have their own pyprojects
# and venvs. Without this, `uv run pytest` from the repository root would
# collect their tests and fail on the uninstalled extensions.
testpaths = ["tests"]

[tool.ty.src]
# lef_tools and def_tools are separate projects with their own venvs and
# `ty check` runs.
exclude = ["lef_tools", "def_tools"]
