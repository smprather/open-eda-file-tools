[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "def-tools"
version = "2026.11.3.dev0"
description = "Fast DEF parsing and query tools"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Myles Prather" },
]
keywords = ["eda", "def", "lef", "vlsi", "placement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.4.1",
    "rich-click>=1.9.8",
]

[project.scripts]
def-tools = "def_tools.cli:main"

[project.urls]
Repository = "https://github.com/smprather/open-eda-file-tools"
Issues = "https://github.com/smprather/open-eda-file-tools/issues"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=9.0.3",
    "ruff>=0.16.2",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["target", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "BLE",    # blind except (io_config.py suppresses this deliberately)
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into the generator's internals on purpose.
"tests/**" = ["SLF001"]

[tool.ty.src]
include = ["src", "examples", "tests"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the `tests.gen`
# generator package.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["perf: performance test, needs --runperf"]

[tool.uv.workspace]
members = ["."]

[tool.maturin]
bindings = "pyo3"
module-name = "def_tools._def"
python-source = "src"
include = ["src/def_tools/py.typed", "src/def_tools/_def.pyi"]
exclude = [
    "*.def",
    "*.def.gz",
    "*.lef",
    "*.pdf",
    "*.sdc",
    "*.ldefcache",
    "dist",
    "target",
]
