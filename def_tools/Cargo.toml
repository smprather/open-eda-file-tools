[package]
name = "def-tools-native"
version = "2026.11.1"
edition = "2024"
description = "Rust backend for fast DEF parsing and queries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/smprather/open-eda-file-tools"

[lib]
name = "def_tools_native"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
arrow = { version = "60.1", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
parquet = { version = "60.1", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.11"
# LEF parser and the shared tokenizer. The DEF Python API does not import the
# LEF package; this is a Rust-only dependency.
lef-tools-native = { path = "../lef_tools" }
