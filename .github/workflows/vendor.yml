name: Vendored crates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The native extension must build from vendor/cargo alone. Any crate
      # cargo tries to fetch fails loudly instead of falling back to crates.io.
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Verify vendor/cargo matches its checksum manifests
        run: python3 scripts/check_vendored_crates.py

      - name: Build the Rust crate offline
        run: cargo build --offline --locked

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build open-eda-file-tools wheel offline
        run: uv build --wheel
